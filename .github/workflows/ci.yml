name: Dart and Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    name: Pure Dart package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Resolve dependencies
        run: dart pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: dart analyze lib test
      - name: Run tests
        run: dart test
      - name: Compile and run portable helper smoke test on JavaScript
        run: |
          dart compile js tool/web_compat_smoke.dart -o /tmp/anki_dart_web_compat.js
          node /tmp/anki_dart_web_compat.js
      - name: Validate licenses and COPYING
        run: python3 tool/check_licenses.py

  anki-backend-protocol:
    name: AGPL Anki protobuf package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - uses: arduino/setup-protoc@v3
        with:
          version: 29.3
          repo-token: ${{ github.token }}
      - name: Resolve protocol package dependencies
        working-directory: packages/anki_backend_protocol
        run: dart pub get
      - name: Check generated protocol output
        run: |
          packages/anki_backend_protocol/tool/generate.sh
          git diff --exit-code -- packages/anki_backend_protocol/lib
          untracked=$(git ls-files --others --exclude-standard -- packages/anki_backend_protocol/lib)
          if [[ -n "$untracked" ]]; then
            echo "Generated protocol output includes untracked files:" >&2
            echo "$untracked" >&2
            exit 1
          fi
      - name: Check formatting
        working-directory: packages/anki_backend_protocol
        run: dart format --output=none --set-exit-if-changed lib/anki_backend_protocol.dart test tool
      - name: Analyze protocol package
        working-directory: packages/anki_backend_protocol
        run: dart analyze lib test tool
      - name: Test wire compatibility
        working-directory: packages/anki_backend_protocol
        run: dart test
      - name: Compile for the web-compatible Dart target
        working-directory: packages/anki_backend_protocol
        run: dart compile js tool/compile_smoke.dart -o /tmp/anki_backend_protocol.js
      - name: Test SPDX normalization and checks
        working-directory: packages/anki_backend_protocol
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Validate source license and generated files
        working-directory: packages/anki_backend_protocol
        run: python3 tool/check_package.py

  flutter-test:
    name: Flutter app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Resolve Flutter app dependencies
        working-directory: apps/anki
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: apps/anki
        run: flutter analyze
      - name: Test Flutter app
        working-directory: apps/anki
        run: flutter test

  flutter-web:
    name: Flutter web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Build web
        working-directory: apps/anki
        run: flutter build web

  flutter-android:
    name: Flutter Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Build Android APK
        working-directory: apps/anki
        run: flutter build apk --debug

  flutter-linux:
    name: Flutter Linux desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Build Linux desktop
        working-directory: apps/anki
        run: flutter build linux --debug

  flutter-windows:
    name: Flutter Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Build Windows desktop
        working-directory: apps/anki
        run: flutter build windows --debug

  flutter-macos:
    name: Flutter macOS desktop build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Build macOS desktop
        working-directory: apps/anki
        run: flutter build macos --debug

  flutter-ios:
    name: Flutter iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Build iOS without code signing
        working-directory: apps/anki
        run: flutter build ios --no-codesign

  anki-backend-models:
    name: AGPL Anki card and note models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Resolve model package dependencies
        working-directory: packages/anki_backend_models
        run: dart pub get
      - name: Check formatting
        working-directory: packages/anki_backend_models
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze model package
        working-directory: packages/anki_backend_models
        run: dart analyze lib test tool
      - name: Test card and note models
        working-directory: packages/anki_backend_models
        run: dart test
      - name: Compile for the web-compatible Dart target
        working-directory: packages/anki_backend_models
        run: dart compile js tool/compile_smoke.dart -o /tmp/anki_backend_models.js
      - name: Validate AGPL provenance and source hashes
        working-directory: packages/anki_backend_models
        run: python3 tool/check_package.py
  anki-collection-schema:
    name: AGPL Anki collection schema catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Resolve schema package dependencies
        working-directory: packages/anki_collection_schema
        run: dart pub get
      - name: Check formatting
        working-directory: packages/anki_collection_schema
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze schema package
        working-directory: packages/anki_collection_schema
        run: dart analyze lib test tool
      - name: Test schema catalog and source fixtures
        working-directory: packages/anki_collection_schema
        run: dart test
      - name: Compile web-compatible smoke target
        working-directory: packages/anki_collection_schema
        run: dart compile js tool/compile_smoke.dart -o /tmp/anki_collection_schema.js
      - name: Validate AGPL source hashes and package metadata
        working-directory: packages/anki_collection_schema
        run: python3 tool/check_package.py
  anki-collection-sqlite:
    name: AGPL Anki collection SQLite adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Resolve SQLite adapter dependencies
        working-directory: packages/anki_collection_sqlite
        run: dart pub get
      - name: Check formatting
        working-directory: packages/anki_collection_sqlite
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze SQLite adapter
        working-directory: packages/anki_collection_sqlite
        run: dart analyze lib test tool
      - name: Test real SQLite storage adapter
        working-directory: packages/anki_collection_sqlite
        run: dart test
      - name: Compile native SQLite driver smoke target
        working-directory: packages/anki_collection_sqlite
        run: dart compile exe tool/native_compile_smoke.dart -o /tmp/anki_collection_sqlite
      - name: Compile web and IndexedDB driver smoke target
        working-directory: packages/anki_collection_sqlite
        run: dart compile js tool/web_compile_smoke.dart -o /tmp/anki_collection_sqlite.js
      - name: Validate AGPL metadata and Dart SPDX headers
        working-directory: packages/anki_collection_sqlite
        run: python3 tool/check_package.py

  anki-search-parser:
    name: AGPL Anki search query parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Resolve parser package dependencies
        working-directory: packages/anki_search_parser
        run: dart pub get
      - name: Check formatting
        working-directory: packages/anki_search_parser
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze parser package
        working-directory: packages/anki_search_parser
        run: dart analyze lib test tool
      - name: Test parser grammar and error fixtures
        working-directory: packages/anki_search_parser
        run: dart test
      - name: Compile and run JavaScript parser smoke test
        working-directory: packages/anki_search_parser
        run: |
          dart compile js tool/compile_smoke.dart -o /tmp/anki_search_parser.js
          node /tmp/anki_search_parser.js
      - name: Validate AGPL provenance and source hash
        working-directory: packages/anki_search_parser
        run: python3 tool/check_package.py
