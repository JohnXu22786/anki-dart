name: anki_app
description: Flutter application for the Anki Dart workspace.
publish_to: none
version: 0.1.0+1
license: AGPL-3.0-or-later

environment:
  sdk: ^3.13.7

dependencies:
  characters: ^1.4.0
  anki_dart:
    path: ../..
  anki_collection_sqlite:
    path: ../../packages/anki_collection_sqlite
  anki_backend_models:
    path: ../../packages/anki_backend_models
  anki_backend_protocol:
    path: ../../packages/anki_backend_protocol
  fixnum: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqlite3: ^3.9.1

flutter:
  uses-material-design: true
  generate: true
