name: anki_collection_sqlite
description: Cross-platform SQLite adapter for Anki collection schema opening.
version: 0.1.0
publish_to: none
license: AGPL-3.0-or-later

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  anki_backend_protocol:
    path: ../anki_backend_protocol
  anki_backend_models:
    path: ../anki_backend_models
  anki_backend_storage:
    path: ../anki_backend_storage
  anki_collection_schema:
    path: ../anki_collection_schema
  anki_search_sql:
    path: ../anki_search_sql
  anki_search_parser:
    path: ../anki_search_parser
  anki_scheduler_timing:
    path: ../anki_scheduler_timing
  fixnum: ^1.1.0
  protobuf: ^3.1.0
  sqlite3: ^3.9.1
  unorm_dart: ^0.3.3
  web: ^1.1.2
  archive: ^4.7.1
  crypto: ^3.0.7
  html: ^0.15.5

dev_dependencies:
  test: ^1.25.8
  typed_data: ^1.4.0
  pure_zstd: ^1.1.0
